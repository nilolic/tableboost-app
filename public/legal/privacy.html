<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Privatnost - TableBoost</title>
<style>body{max-width:860px;margin:40px auto;padding:20px;font-family:system-ui;line-height:1.7}h2{margin-top:28px;border-bottom:1px solid #eee}.badge{background:#d4ff00;padding:5px 12px;border-radius:20px;font-size:11px;font-weight:800}.box{background:#f6f6f6;padding:14px;border-radius:12px}</style>
<body>
<span class="badge" id="badge">UČITAVANJE...</span>
<h1>Politika privatnosti - TableBoost</h1>
<div class="box" id="who"></div>
<div id="c"></div>
<script>
fetch('/api/public/company').then(r=>r.json()).then(co=>{
  const c={naziv:co.naziv_obrta||'CoreCode',oib:co.oib||'[OIB]',mbo:co.broj_obrta||'[MBO]',adresa:co.adresa||'[adresa]',grad:co.grad||'',email:co.email||'info@tableboost.app'};
  document.getElementById('badge').textContent=co.is_demo?'DEMO':'Ažurirano: '+new Date().toLocaleDateString('hr-HR');
  document.getElementById('who').innerHTML=`<b>Voditelj obrade (platforma):</b> ${c.naziv}<br>TableBoost - ${c.adresa} ${c.grad}<br>OIB: ${c.oib} | MBO: ${c.mbo}<br>Email: ${c.email}`;
  document.getElementById('c').innerHTML=`
<h2>1. Što prikupljamo</h2><p>Podatke objekta: ime, email, OIB objekta, rezervacije, stolovi, narudžbe. Podatke gostiju objekta: ime, email, telefon, vrijeme rezervacije. Ne pohranjujemo puni broj kartice.</p>
<h2>2. Dva modela plaćanja</h2><p><b>Pretplata:</b> virman/gotovina na račun ${c.naziv} - paušalac, nije u PDV-u. Ne obrađujemo kartice za pretplatu.<br><b>Gost preko Stripe-a objekta:</b> Kad objekt uključi svoj Stripe, podaci o kartici idu direktno u Stripe infrastrukturu objekta (Stripe.js). Puni PAN obrađuje isključivo Stripe. TableBoost vidi samo zadnje 4 znamenke, iznos, Stripe PaymentIntent ID.</p>
<h2>3. Svrha i pravna osnova</h2><p>Izvršenje ugovora (SaaS), legitimni interes (sigurnost, sprječavanje zlouporaba), zakonska obveza (računovodstvo).</p>
<h2>4. Dijeljenje</h2><p>Ne prodajemo podatke. Hosting na EU serverima. Ako objekt koristi svoj Stripe, podaci se dijele sa Stripe Inc. kao izvršiteljem u ime objekta. Objekt je voditelj za te transakcije.</p>
<h2>5. Rokovi</h2><p>Podaci objekta za vrijeme pretplate + 11 godina za račune. Podaci rezervacija prema postavkama objekta.</p>
<h2>6. Prava ispitanika</h2><p>Pristup, ispravak, brisanje, prigovor na ${c.email}. Za plaćanja gostiju ostvarena preko Stripe-a objekta - prava se ostvaruju i kod objekta kao trgovca.</p>
${!co.legal_visible?'<p style=background:#fff9c4;padding:12px;border-radius:12px>DEMO PREDLOŽAK</p>':""}
<p><a href="/legal/terms.html">Uvjeti</a> | <a href="/legal/cookies.html">Kolačići</a> | <a href="/legal/dpa.html">DPA</a></p>
`;});
</script>
