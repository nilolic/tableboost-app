<p class="muted">Datum: <span class="field" contenteditable="true">${new Date().toLocaleDateString('hr-HR')}</span> | Broj ugovora: <span class="field" contenteditable="true">TB-DPA-____/2026</span> | Verzija TableBoost: 1.0</p>
<h2>1. Predmet i trajanje</h2><p>Izvršitelj pruža SaaS TableBoost za upravljanje stolovima, rezervacijama, pologom/no-show zaštitom. Obrada osobnih podataka gostiju objekta vrši se isključivo po pisanim uputama Voditelja (objekta) za vrijeme trajanja pretplate na TableBoost.</p>
<h2>2. Vrste podataka i ispitanici</h2><p><b>Bez Stripe-a objekta:</b> Ispitanici su gosti objekta koji rezerviraju stol. Podaci: ime, email, telefon, vrijeme rezervacije, broj osoba, interna napomena.<br><b>Sa Stripe-om objekta (kad Voditelj poveže svoj Stripe):</b> + iznos pologa / no-show naknade, valuta, zadnje 4 znamenke kartice, Stripe PaymentIntent ID, status naplate. Puni broj kartice (PAN), CVC, datum isteka obrađuje isključivo Stripe kao podizvršitelj Voditelja. Izvršitelj ne pohranjuje PAN.</p>
<h2>3. Dva odvojena novčana toka - bitno za uloge</h2><p><b>3.1 Pretplata TableBoost:</b> Voditelj plaća Izvršitelju ${c.naziv} virmanom na IBAN ili gotovinom uz račun. Izvršitelj je paušalni obrt, nije u PDV-u. Za pretplatu se ne koristi Stripe, nema online naplate karticama Izvršitelja.<br><b>3.2 Naplata gosta od strane Voditelja preko vlastitog Stripe-a:</b> Kad Voditelj unese API ključeve svog Stripe računa u TableBoost, Voditelj postaje trgovac (merchant of record) i voditelj obrade za podatke o kartici. Izvršitelj djeluje samo kao tehnički posrednik koji prosljeđuje zahtjev u Stripe račun Voditelja. Novac, povrati, chargebackovi idu direktno između Voditelja i Stripe-a. Izvršitelj nema pristup sredstvima.</p>
<h2>4. Podizvršitelji</h2><p>Hetzner (hosting EU), Coolify. Ako Voditelj koristi vlastiti Stripe, dodatni podizvršitelj je Stripe Inc. / Stripe Payments Europe za obradu kartica u ime Voditelja. Popis na upit.</p>
<h2>5. Sigurnost - čl.32</h2><p>TLS 1.2+, bcrypt za lozinke, RBAC (SUPER_ADMIN / RESTAURANT_ADMIN / WAITER), logiranje pristupa, dnevni backup. Incident koji utječe na podatke Voditelja - obavijest Voditelju bez odgađanja, najkasnije 24h od saznanja.</p>
<h2>6. Prava ispitanika i suradnja</h2><p>Izvršitelj pomaže Voditelju tehničkim mjerama za ostvarenje prava gostiju (pristup, brisanje rezervacije). Za zahtjeve koji se odnose na naplate karticama preko Stripe-a Voditelja, Voditelj odgovara kao trgovac, Izvršitelj pruža Stripe ID-eve i logove.</p>
<h2>7. Povrat i brisanje nakon prestanka</h2><p>Na zahtjev Voditelja - izvoz CSV + brisanje u 30 dana, osim zakonskih obveza čuvanja računa (11g).</p>
<h2>8. Međunarodni prijenosi</h2><p>Primarno EU. Ako Stripe obrađuje izvan EU, primjenjuju se SCC-ovi Stripe-a u ime Voditelja.</p>
